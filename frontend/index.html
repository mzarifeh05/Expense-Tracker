<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar navbar-dark bg-dark">
    <h1 class="h4 mb-0">Expense Tracker</h1>
  </nav>

  <div class="container">

    <div id="alertPlaceholder"></div>

    <div class="highlights">
      <div>
        <span class="text-muted small">Total</span>
        <span class="fs-3 fw-bold" id="summaryTotal">0.00</span>
      </div>
      <div>
        <span class="text-muted small">Number of expenses</span>
        <span class="fs-3 fw-bold" id="summaryCount">0</span>
      </div>
      <div>
        <span class="text-muted small">Highest expense</span>
        <span class="fs-3 fw-bold" id="summaryHighest">0.00</span>
        <span class="text-muted small" id="summaryHighestTitle">-</span>
      </div>
    </div>

    <div class="card mt-4">
      <div class="card-body">
        <h2 class="h5 card-title mb-3">Add expense</h2>
        <form id="expenseForm" class="row g-3">
          <input type="hidden" id="expenseId">
          <div class="col-md-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" placeholder="Lunch" required maxlength="100">
          </div>
          <div class="col-md-3">
            <label for="amount" class="form-label">Amount</label>
            <input type="number" class="form-control" id="amount" placeholder="4.50" step="0.01" min="0.01" required>
          </div>
          <div class="col-md-3">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" id="category" required>
              <option value="" selected disabled>Choose...</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" required>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <span class="spinner-border spinner-border-sm d-none" id="submitSpinner"></span>
              <span id="submitBtnText">Add expense</span>
            </button>
            <button type="button" class="btn btn-outline-secondary d-none" id="cancelEditBtn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card mt-4 mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h5 card-title mb-0">Expenses</h2>
          <div class="d-flex align-items-center gap-2">
            <label for="categoryFilter" class="form-label mb-0">Category</label>
            <select class="form-select form-select-sm" id="categoryFilter" style="width: auto;">
              <option value="All">All</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Title</th>
                <th class="text-end">Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th class="text-end">Actions</th>
              </tr>
            </thead>
            <tbody id="expensesBody">
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
